name: daily-data

on:
  schedule:
    # 北京时间 15:10（UTC 07:10），周一到周五
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit data (accumulate history)
        run: |
          git config user.name "stocklab-bot"
          git config user.email "stocklab-bot@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4