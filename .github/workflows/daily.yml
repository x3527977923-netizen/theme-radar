name: daily-data

on:
  schedule:
    # 北京时间 15:10 / 15:40 / 16:15 / 16:50 / 17:35 / 18:20 / 20:10
    # 兼顾收盘行情（15:05后）与交易所龙虎榜发布（17:00~18:00），同时抵消 GitHub Actions 队列延迟；
    # 脚本幂等：行情与当日龙虎榜均齐备时秒退，不产生多余提交。
    - cron: '10 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '15 8 * * 1-5'
    - cron: '50 8 * * 1-5'
    - cron: '35 9 * * 1-5'
    - cron: '20 10 * * 1-5'
    - cron: '10 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit data (accumulate history)
        run: |
          git config user.name "stocklab-bot"
          git config user.email "stocklab-bot@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git pull --rebase origin main || true
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
