name: daily-data

on:
  schedule:
    # 北京时间 15:10 / 15:40 / 16:10 / 16:40 / 17:25
    # GitHub 免费 cron 会延迟（实测曾延迟 9 小时），所以多排几次；
    # 脚本是幂等的：当天数据已存在就直接退出，不产生多余提交。
    - cron: '10 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '10 8 * * 1-5'
    - cron: '40 8 * * 1-5'
    - cron: '25 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit data (accumulate history)
        run: |
          git config user.name "stocklab-bot"
          git config user.email "stocklab-bot@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4